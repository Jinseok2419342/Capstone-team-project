<script>const notes=[["연구 주제", "저사양 장치가 상태 변화를 먼저 찾고, 필요한 사건의 의미만 외부 AI에 묻는 시스템입니다.", [["사건 기반", "영상 한 장마다 물품명을 묻기보다, 추가·이동·제거가 일어난 시점을 처리 단위로 삼습니다."], ["선택적 추론", "신규 물품과 모호한 제거에만 전후 증거를 전송합니다."], ["현재 단계", "시스템 구현은 되어 있습니다. 정확도와 비용 등의 정량 평가는 앞으로 수행합니다."]]], ["연구가 필요한 이유", "보관대에서는 물품의 이름만큼, 언제 들어오고 이동하고 사라졌는지를 기록하는 일이 중요합니다.", [["구체적인 문제", "같은 물건을 옮겼는데 새 물품으로 등록하거나, 조명이 바뀌었는데 물건이 생겼다고 판단하면 안 됩니다."], ["연구 범위", "보관대 물품의 상태를 관리합니다. 소유자를 추적하거나 실제 인계를 증명하는 연구는 아닙니다."], ["설명할 흐름", "업무의 필요 → 기존 접근 → 영상 차이의 어려움 → 연구 목적 순서로 읽으면 됩니다."]]], ["세 가지 배경 개념", "변화 감지는 무엇이 달라졌는지, 엣지는 어디서 처리할지, 멀티모달 추론은 그 변화가 무엇을 뜻하는지와 연결됩니다.", [["안정 장면", "손이 물건을 놓는 중간 모습과 손이 빠진 뒤의 최종 배치를 구분합니다."], ["엣지 컴퓨팅", "카메라 가까운 Raspberry Pi에서 기초 분석을 수행합니다."], ["시각 증거", "전체 장면은 위치와 맥락을, 확대 영역은 물품의 특징을 제공할 수 있습니다. 네 장의 우수성은 아직 실험할 내용입니다."]]], ["기존 연구와의 관계", "관련 연구의 정확도 순위를 만드는 표가 아닙니다. 각 연구가 풀려는 문제와 우리의 초점을 비교합니다.", [["가까운 선행연구", "차량의 전후 이미지를 비교한 연구와 입력을 먼저 선별하는 영상 분석 연구가 중요한 출발점입니다."], ["우리 연구의 초점", "로컬 사건 선별, 외부 의미 추론, 보관 관리 기록을 하나의 과정으로 연결합니다."], ["다음 본론으로 연결", "구체적인 알고리즘과 실험 설계는 이번 범위 이후의 연구방법에서 설명합니다."]]]];function show(i){const n=notes[i];document.getElementById('paper').src='../../../output/pdf/RESEARCH_FRONT_MATTER.pdf#page='+(i+1)+'&view=FitH';const aside=document.getElementById('note');aside.replaceChildren();function add(tag,txt){const e=document.createElement(tag);e.textContent=txt;aside.appendChild(e)}add('h1',n[0]);add('p',n[1]);n[2].forEach(x=>{add('h2',x[0]);add('p',x[1])});add('small','오른쪽은 이해를 돕는 설명입니다. 제출·공유용 원고는 왼쪽의 4쪽 PDF를 사용하세요.');document.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j?'true':'false'))}document.querySelectorAll('button').forEach((b,i)=>b.addEventListener('click',()=>show(i)));show(0)</script></html>
